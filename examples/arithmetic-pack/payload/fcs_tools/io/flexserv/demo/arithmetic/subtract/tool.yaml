schema_version: flexserv.tool.v1alpha3
kind: Tool
metadata:
  name: io.flexserv.demo.arithmetic.subtract
  version: 1.0.0
  visibility: true
  labels:
    demo: arithmetic
    operation: subtract
spec:
  contract:
    description: Subtract using BashKit's in-process bc builtin
    parameters_schema:
      type: object
      properties:
        a: &id001
          type: number
          minimum: -1000000000000.0
          maximum: 1000000000000.0
        b: *id001
      required:
      - a
      - b
      additionalProperties: false
    output_schema:
      type: object
      properties:
        value: *id001
      required:
      - value
      additionalProperties: false
  skills:
  - skill://io.flexserv.demo.arithmetic.subtract/1.0.0/subtract/SKILL.md
  policy: {}
  steps:
  - id: execute
    kind: bashkit
    script: scripts/run.sh
    input:
      a: '{{params.a|decimal}}'
      b: '{{params.b|decimal}}'
    uses: {}
  result: '{{steps.execute}}'
