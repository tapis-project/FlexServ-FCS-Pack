schema_version: flexserv.tool.v1alpha3
kind: Tool
metadata:
  name: io.flexserv.demo.arithmetic.add
  version: 1.0.0
  visibility: true
  labels:
    demo: arithmetic
    operation: add
spec:
  contract:
    description: Add using the governed host bc CLI executable
    parameters_schema:
      type: object
      properties:
        a: &id001
          type: number
          minimum: -1000000000000.0
          maximum: 1000000000000.0
        b: *id001
      required:
      - a
      - b
      additionalProperties: false
    output_schema:
      type: object
      properties:
        value: *id001
      required:
      - value
      additionalProperties: false
  skills:
  - skill://io.flexserv.demo.arithmetic.add/1.0.0/add/SKILL.md
  policy:
    programs:
    - bc
    filesystem:
      read:
      - /
      write: []
  steps:
  - id: execute
    kind: process
    process: calculator
  processes:
    calculator:
      type: command
      execution_profile: arithmetic_bc
      program: bc
      argv: []
      cwd: '{{host.ARITHMETIC_CWD}}'
      stdin: '({{params.a|decimal}})+({{params.b|decimal}})

        '
      environment: {}
      timeouts:
        execution_seconds: 5
      output:
        mode: number
  result:
    value: '{{steps.execute.value}}'
