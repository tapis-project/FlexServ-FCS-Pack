schema_version: flexserv.tool.v1alpha3
kind: Tool
metadata:
  name: io.flexserv.demo.workflows.parallel_batch
  version: 1.0.0
  visibility: true
  labels:
    demo: arithmetic
    operation: parallel_batch
spec:
  contract:
    description: Map complete expressions concurrently with ordered collected results
    parameters_schema:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              a: &id001
                type: number
                minimum: -1000000000000.0
                maximum: 1000000000000.0
              b: *id001
              c: *id001
              d: *id001
              e: *id001
            required:
            - a
            - b
            - c
            - d
            - e
            additionalProperties: false
          maxItems: 16
      required:
      - items
      additionalProperties: false
    output_schema:
      type: object
  skills:
  - skill://io.flexserv.demo.workflows.parallel_batch/1.0.0/parallel_batch/SKILL.md
  policy:
    programs:
    - bc
    filesystem:
      read:
      - /
      write: []
  steps:
  - id: execute
    kind: bashkit
    script: scripts/run.sh
    input: '{{params}}'
    uses:
      tool_expression:
        name: io.flexserv.demo.workflows.expression
        version: 1.0.0
  result: '{{steps.execute}}'
  execution:
    mode: background
    timeout_seconds: 90
    max_calls: 256
