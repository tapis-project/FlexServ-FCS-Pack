schema_version: flexserv.tool.v1alpha3
kind: Tool
metadata:
  name: io.flexserv.demo.workflows.expression
  version: 1.0.0
  visibility: true
  labels:
    demo: arithmetic
    operation: expression
spec:
  contract:
    description: Combine all five executors with conditional and concurrent execution
    parameters_schema:
      type: object
      properties:
        a: &id001
          type: number
          minimum: -1000000000000.0
          maximum: 1000000000000.0
        b: *id001
        c: *id001
        d: *id001
        e: *id001
      required:
      - a
      - b
      - c
      - d
      - e
      additionalProperties: false
    output_schema:
      type: object
      properties:
        value: *id001
      required:
      - value
      additionalProperties: false
  skills:
  - skill://io.flexserv.demo.workflows.expression/1.0.0/expression/SKILL.md
  policy:
    programs:
    - bc
    filesystem:
      read:
      - /
      write: []
  steps:
  - id: execute
    kind: bashkit
    script: scripts/run.sh
    input: '{{params}}'
    uses:
      tool_add:
        name: io.flexserv.demo.arithmetic.add
        version: 1.0.0
      tool_subtract:
        name: io.flexserv.demo.arithmetic.subtract
        version: 1.0.0
      tool_divide:
        name: io.flexserv.demo.arithmetic.divide
        version: 1.0.0
      tool_square:
        name: io.flexserv.demo.arithmetic.square
        version: 1.0.0
      tool_multiply:
        name: io.flexserv.demo.native.multiply
        version: 1.0.0
  result: '{{steps.execute}}'
  execution:
    mode: background
    timeout_seconds: 90
    max_calls: 256
