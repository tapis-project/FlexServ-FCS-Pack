schema_version: flexserv.tool.v1alpha3
kind: Tool
metadata:
  name: io.flexserv.demo.workflows.status
  version: 1.0.0
  visibility: true
  labels:
    demo: arithmetic
    operation: status
spec:
  contract:
    description: Observe an owned arithmetic workflow
    parameters_schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
      description: Observer operations use workflow IDs rather than inferring remote
        job identity.
      properties:
        workflow_id:
          type: string
      required:
      - workflow_id
      title: WorkflowControlInput
      type: object
    output_schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
      description: Progress/report are bounded dynamic workflow metadata, not executable
        configuration.
      properties:
        done:
          type: boolean
        elapsed_seconds:
          format: double
          minimum: 0.0
          type: number
        progress:
          additionalProperties: true
          type: object
        report: true
        status:
          type: string
        tool:
          type: string
        workflow_id:
          type: string
      required:
      - workflow_id
      - tool
      - status
      - elapsed_seconds
      - progress
      - done
      title: WorkflowObservation
      type: object
  skills:
  - skill://io.flexserv.demo.workflows.status/1.0.0/status/SKILL.md
  policy: {}
  steps:
  - id: control
    kind: call
    tool:
      name: workflow.status
      version: 1.0.0
    input: '{{params}}'
