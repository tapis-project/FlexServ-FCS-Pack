schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.flexserv.content.scan_to_secret
  version: 1.0.0
  visibility: false
spec:
  contract:
    description: io.flexserv.content.scan_to_secret (bounded, owner-authorized workflow
      component)
    parameters_schema:
      type: object
      properties:
        content_ref: &id001
          type: object
        marker:
          type: string
          minLength: 1
          maxLength: 4096
        max_lines:
          type: integer
          minimum: 1
          maximum: 200
        match:
          enum:
          - prefix
          - after_literal
      required:
      - content_ref
      - marker
      additionalProperties: false
    output_schema: *id001
  policy:
    resources:
    - local_login
    - ssh_keys
    - ssh_workspace
    - service_tokens
    programs:
    - bash
    filesystem:
      read:
      - /
      write:
      - '{{host.SCRATCH}}/'
  steps:
  - id: execute
    kind: native
    tool: content.scan_to_secret
    input: '{{params}}'
