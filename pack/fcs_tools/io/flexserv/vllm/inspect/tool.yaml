schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.flexserv.vllm.inspect
  version: 1.0.0
  visibility: true
spec:
  contract:
    description: Inspect the owned service and a bounded current descendant snapshot.
    parameters_schema: schemas/input.json
    output_schema: schemas/output.json
  policy:
    derive: dependencies
    resources:
    - local_vllm
  steps:
  - id: run
    kind: call
    tool:
      name: local.vllm.v2.inspect
      version: 1.0.0
    input:
      profile: local_vllm
      input: '{{params}}'
  result: '{{steps.run}}'
