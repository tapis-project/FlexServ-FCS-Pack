schema_version: flexserv.tool.v1alpha3
kind: Tool
metadata:
  name: io.flexserv.vllm.stop
  version: 1.0.0
  visibility: true
spec:
  contract:
    description: Stop one owned v2 deployment through the existing supervisor lifecycle.
    parameters_schema: schemas/input.json
    output_schema: schemas/output.json
  policy:
    derive: dependencies
    resources:
    - local_vllm
  steps:
  - id: run
    kind: call
    tool:
      name: local.vllm.v2.stop
      version: 1.0.0
    input:
      profile: local_vllm
      input: '{{params}}'
  result: '{{steps.run}}'
