schema_version: flexserv.tool.v1alpha3
kind: Tool
metadata:
  name: io.flexserv.vllm.status
  version: 1.0.0
  visibility: true
spec:
  contract:
    description: Read only the authenticated owner's session; opaque IDs are never
      authority.
    parameters_schema: schemas/input.json
    output_schema: schemas/output.json
  policy:
    derive: dependencies
    resources:
    - local_vllm
  steps:
  - id: run
    kind: call
    tool:
      name: local.vllm.v2.status
      version: 1.0.0
    input:
      profile: local_vllm
      input: '{{params}}'
  result: '{{steps.run}}'
