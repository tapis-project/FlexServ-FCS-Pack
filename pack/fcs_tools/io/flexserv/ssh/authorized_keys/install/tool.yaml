schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.flexserv.ssh.authorized_keys.install
  version: 1.0.0
  visibility: false
spec:
  contract:
    description: io.flexserv.ssh.authorized_keys.install (bounded, owner-authorized
      workflow component)
    parameters_schema:
      type: object
      properties:
        target: &id001
          type: string
          minLength: 1
          maxLength: 4096
        public_key: *id001
      required:
      - target
      - public_key
      additionalProperties: false
    output_schema:
      type: object
  policy:
    resources:
    - local_login
    - ssh_keys
    - ssh_workspace
    - service_tokens
    programs:
    - bash
    filesystem:
      read:
      - /
      write:
      - '{{host.SCRATCH}}/'
  steps:
  - id: execute
    kind: native
    tool: ssh.authorized_keys.install
    input: '{{params}}'
