schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.flexserv.paths.resolve_relative
  version: 1.0.0
  visibility: false
spec:
  contract:
    description: io.flexserv.paths.resolve_relative (bounded, owner-authorized workflow
      component)
    parameters_schema:
      type: object
      properties:
        root:
          type: string
        base: &id001
          type: string
          minLength: 1
          maxLength: 4096
        path: *id001
      required:
      - root
      - base
      - path
      additionalProperties: false
    output_schema:
      type: object
  policy:
    resources:
    - local_login
    - ssh_keys
    - ssh_workspace
    - service_tokens
    programs:
    - bash
    filesystem:
      read:
      - /
      write:
      - '{{host.SCRATCH}}/'
  steps:
  - id: execute
    kind: native
    tool: path.resolve_relative
    input: '{{params}}'
