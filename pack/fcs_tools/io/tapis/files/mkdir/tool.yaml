schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.files.mkdir
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-files
spec:
  contract:
    description: Tapis files.mkdir
    parameters_schema:
      type: object
      properties:
        system_id:
          type: string
          minLength: 1
          maxLength: 256
        path:
          type: string
          maxLength: 2048
          description: Relative system path; no empty interior, dot, parent, percent
            or backslash segments.
      required:
      - system_id
      - path
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
    request:
      connection: tapis
      operation: files.mkdir
      params: '{{params}}'
