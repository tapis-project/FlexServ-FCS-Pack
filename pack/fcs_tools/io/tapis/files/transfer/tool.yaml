schema_version: flexserv.tool.v1alpha1
kind: Tool
metadata:
  name: io.tapis.files.transfer
  version: 0.1.0
  labels: { execution_types: "REST", tapis_domain: files, pack: tapis-files }
spec:
  contract:
    description: Create a multi-element asynchronous Tapis file transfer task.
    read_only: false
    concurrency_safe: true
    required_scopes: ["tapis:files:write"]
    parameters_schema:
      type: object
      additionalProperties: false
      properties:
        tag: { type: string }
        elements:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              sourceURI: { type: string }
              destinationURI: { type: string }
              optional: { type: boolean }
            required: [sourceURI, destinationURI]
      required: [tag, elements]
  policy:
    provider: flexserv
    confirmation: always
    required_scopes: ["tapis:files:write"]
    network: { allowed_hosts: ["tapis.io"], allowed_schemes: ["https"], require_tls_for_remote: true }
    resources: { timeout_ms: 30000, rate_limit_per_minute: 30 }
  steps:
    - id: create_transfer
      kind: rest
      method: POST
      url: "{{secrets.base_url}}/v3/files/transfers"
      secret_refs: { base_url: tapis.base_url, access_token: tapis.access_token }
      headers: { Content-Type: application/json, X-Tapis-Token: "{{secrets.access_token}}" }
      body: { tag: "{{input.tag}}", elements: "{{input.elements}}" }
      response: { type: json }
      timeout_ms: 30000
