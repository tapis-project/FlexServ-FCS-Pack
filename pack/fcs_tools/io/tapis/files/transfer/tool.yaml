schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.files.transfer
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-files
spec:
  contract:
    description: Tapis files.transfer
    parameters_schema:
      type: object
      properties:
        request:
          type: object
          required:
          - elements
          properties:
            elements:
              type: array
              minItems: 1
              maxItems: 100
          additionalProperties: true
      required:
      - request
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
      priority: header
    request:
      connection: tapis
      operation: files.transfer
      params: '{{params}}'
