schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.pods.search
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-pods
spec:
  contract:
    description: Tapis pods.search
    parameters_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
    request:
      connection: tapis
      operation: pods.search
      params: '{{params}}'
