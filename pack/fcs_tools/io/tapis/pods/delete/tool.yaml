schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.pods.delete
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-pods
spec:
  contract:
    description: Tapis pods.delete
    parameters_schema:
      type: object
      properties:
        pod_id:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - pod_id
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
    request:
      connection: tapis
      operation: pods.delete
      params: '{{params}}'
