schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.pods.deploy_from_template
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-pods
spec:
  contract:
    description: Create a Pod from a named approved remote template. No retry after
      an ambiguous POST result.
    parameters_schema:
      type: object
      properties:
        request:
          type: object
          required:
          - pod_id
          - template
          properties:
            pod_id: &id001
              type: string
              minLength: 1
              maxLength: 256
            template: *id001
          additionalProperties: true
      required:
      - request
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
      priority: header
    request:
      connection: tapis
      operation: pods.deploy_from_template
      params: '{{params}}'
