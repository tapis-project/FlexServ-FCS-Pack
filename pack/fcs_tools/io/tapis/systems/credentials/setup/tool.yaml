schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.systems.credentials.setup
  version: 1.0.0
  visibility: false
spec:
  contract:
    description: io.tapis.systems.credentials.setup (bounded, owner-authorized workflow
      component)
    parameters_schema:
      type: object
      properties:
        target: &id001
          type: string
          minLength: 1
          maxLength: 4096
        system_id: *id001
        provider:
          enum:
          - rust
          - cli
      required:
      - target
      - system_id
      - provider
      additionalProperties: false
    output_schema:
      type: object
  policy:
    resources:
    - local_login
    - ssh_keys
    - ssh_workspace
    - service_tokens
    programs:
    - bash
    filesystem:
      read:
      - /
      write:
      - '{{host.SCRATCH}}/'
  steps:
  - id: target
    kind: call
    tool:
      name: io.flexserv.ssh.target.resolve
      version: 1.0.0
    input:
      target: '{{params.target}}'
  - id: system
    kind: call
    tool:
      name: io.tapis.systems.get
      version: 0.12.0
    input:
      system_id: '{{params.system_id}}'
  - id: confirmed
    kind: call
    tool:
      name: io.tapis.responses.require_success
      version: 1.0.0
    input:
      response: '{{steps.system}}'
  - id: validate
    kind: bashkit
    script: scripts/validate.sh
    input:
      system: '{{steps.system.body.result}}'
      target: '{{steps.target}}'
    uses: {}
  - id: key
    kind: call
    tool:
      name: io.flexserv.ssh.keypair.select
      version: 1.0.0
    input:
      target: '{{steps.target}}'
      provider: '{{params.provider}}'
    progress:
      fingerprint: '{{steps.key.fingerprint}}'
      ssh_target: '{{steps.target.target}}'
  - id: install
    kind: call
    tool:
      name: io.flexserv.ssh.authorized_keys.install
      version: 1.0.0
    input:
      target: '{{params.target}}'
      public_key: '{{steps.key.public_key}}'
    progress:
      ssh_install: '{{steps.install}}'
  - id: register
    kind: call
    tool:
      name: io.tapis.systems.credentials.register
      version: 1.0.0
    input:
      system_id: '{{params.system_id}}'
      tapis_user: '{{steps.target.tapis_user}}'
      login_user: '{{steps.target.login_user}}'
      private_key_ref: '{{steps.key.private_key_ref}}'
      public_key: '{{steps.key.public_key}}'
  result:
    system_id: '{{params.system_id}}'
    fingerprint: '{{steps.key.fingerprint}}'
    installation: '{{steps.install}}'
    registered: true
