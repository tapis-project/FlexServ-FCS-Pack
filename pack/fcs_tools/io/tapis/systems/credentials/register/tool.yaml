schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.systems.credentials.register
  version: 1.0.0
  visibility: false
spec:
  contract:
    description: io.tapis.systems.credentials.register (bounded, owner-authorized
      workflow component)
    parameters_schema:
      type: object
      properties:
        system_id: &id001
          type: string
          minLength: 1
          maxLength: 4096
        tapis_user: *id001
        login_user: *id001
        public_key: *id001
        private_key_ref: &id002
          type: object
      required:
      - system_id
      - tapis_user
      - login_user
      - public_key
      - private_key_ref
      additionalProperties: false
    output_schema: *id002
  policy:
    resources:
    - local_login
    - ssh_keys
    - ssh_workspace
    - service_tokens
    programs:
    - bash
    filesystem:
      read:
      - /
      write:
      - '{{host.SCRATCH}}/'
  steps:
  - id: request
    kind: rest
    request:
      connection: tapis
      method: POST
      path:
      - v3
      - systems
      - credential
      - '{{params.system_id}}'
      - user
      - '{{params.tapis_user}}'
      response: json
      body:
        type: json
        value:
          privateKey: '{{secret.private_key}}'
          publicKey: '{{params.public_key}}'
          loginUser: '{{params.login_user}}'
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
      secret_bindings:
        private_key: '{{params.private_key_ref}}'
  - id: confirmed
    kind: call
    tool:
      name: io.tapis.responses.require_success
      version: 1.0.0
    input:
      response: '{{steps.request}}'
  secret_refs:
    tapis_token: tapis.access_token
  result:
    registered: true
    system_id: '{{params.system_id}}'
