schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.access.check
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-core
spec:
  contract:
    description: Check explicit Tapis system permissions, NOT complete POSIX/role/ownership
      effective access. Unknown response shape returns indeterminate.
    parameters_schema:
      type: object
      properties:
        system_id: &id001
          type: string
          minLength: 1
          maxLength: 256
        username: *id001
        permission:
          enum:
          - READ
          - MODIFY
          - EXECUTE
      required:
      - system_id
      - username
      - permission
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
    request:
      connection: tapis
      operation: access.check
      params: '{{params}}'
