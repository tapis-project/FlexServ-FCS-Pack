schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.jobs.wait
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-jobs
spec:
  contract:
    description: Poll with a bounded deadline. Terminal FAILED/CANCELLED are not reported
      as successful FINISHED; timeout returns pending, never resubmits.
    parameters_schema:
      type: object
      properties:
        job_uuid:
          type: string
          minLength: 1
          maxLength: 128
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 20
          default: 10
      required:
      - job_uuid
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
      priority: header
    request:
      connection: tapis
      operation: jobs.wait
      params: '{{params}}'
