schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.jobs.submit
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-jobs
spec:
  contract:
    description: Tapis jobs.submit
    parameters_schema:
      type: object
      properties:
        request:
          type: object
          required:
          - name
          - appId
          - appVersion
          properties:
            name: &id001
              type: string
              minLength: 1
              maxLength: 256
            appId: *id001
            appVersion: *id001
          additionalProperties: true
      required:
      - request
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
    request:
      connection: tapis
      operation: jobs.submit
      params: '{{params}}'
