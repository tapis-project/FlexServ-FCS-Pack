schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.jobs.wait_state
  version: 1.0.0
  visibility: false
spec:
  contract:
    description: io.tapis.jobs.wait_state (bounded, owner-authorized workflow component)
    parameters_schema:
      type: object
      properties:
        job_uuid:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - job_uuid
      additionalProperties: false
    output_schema:
      type: object
  policy:
    resources:
    - local_login
    - ssh_keys
    - ssh_workspace
    - service_tokens
    programs:
    - bash
    filesystem:
      read:
      - /
      write:
      - '{{host.SCRATCH}}/'
  steps:
  - id: observe
    kind: poll
    tool:
      name: io.tapis.jobs.inspect_checked
      version: 1.0.0
    input: '{{params}}'
    until:
      pointer: /status
      in:
      - RUNNING
      - FINISHED
      - CANCELLED
      - FAILED
    interval_seconds: 5
    max_attempts: 300
    attempt_timeout_seconds: 10
    timeout_seconds: 1550
    on_exhaustion: return_last
  result: '{{steps.observe}}'
