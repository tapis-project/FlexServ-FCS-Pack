schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.jobs.outputs.capture_token
  version: 1.0.0
  visibility: false
spec:
  contract:
    description: io.tapis.jobs.outputs.capture_token (bounded, owner-authorized workflow
      component)
    parameters_schema:
      type: object
      properties:
        job_uuid: &id001
          type: string
          minLength: 1
          maxLength: 4096
        output:
          type: object
          properties:
            source:
              enum:
              - application
              - stdout
              - archive
            file: *id001
            marker:
              type: string
              minLength: 1
              maxLength: 256
              pattern: ^[^\r\n]+$
            match:
              enum:
              - prefix
              - after_literal
            max_bytes:
              type: integer
              minimum: 1
              maximum: 65536
            max_lines:
              type: integer
              minimum: 1
              maximum: 200
          required: []
          additionalProperties: false
      required:
      - job_uuid
      - output
      additionalProperties: false
    output_schema:
      type: object
  policy:
    resources:
    - local_login
    - ssh_keys
    - ssh_workspace
    - service_tokens
    programs:
    - bash
    filesystem:
      read:
      - /
      write:
      - '{{host.SCRATCH}}/'
  steps:
  - id: observe
    kind: poll
    tool:
      name: io.tapis.jobs.outputs.capture_once
      version: 1.0.0
    input: '{{params}}'
    until:
      pointer: /done
      in:
      - true
    interval_seconds: 5
    max_attempts: 25
    attempt_timeout_seconds: 10
    timeout_seconds: 120
    on_exhaustion: return_last
  - id: result
    kind: bashkit
    script: scripts/result.sh
    input: '{{steps.observe}}'
    uses: {}
