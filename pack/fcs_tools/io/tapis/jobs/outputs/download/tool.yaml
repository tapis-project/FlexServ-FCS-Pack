schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.jobs.outputs.download
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-jobs
spec:
  contract:
    description: Tapis jobs.outputs.download
    parameters_schema:
      type: object
      properties:
        job_uuid:
          type: string
          minLength: 1
          maxLength: 128
        output_path:
          type: string
          maxLength: 2048
          description: Relative system path; no empty interior, dot, parent, percent
            or backslash segments.
      required:
      - job_uuid
      - output_path
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
      priority: header
    request:
      connection: tapis
      operation: jobs.outputs.download
      params: '{{params}}'
