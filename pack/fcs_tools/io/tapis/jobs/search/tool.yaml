schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.jobs.search
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-jobs
spec:
  contract:
    description: Tapis jobs.search
    parameters_schema:
      type: object
      properties:
        query:
          type: array
          maxItems: 32
          items:
            type: array
            prefixItems:
            - type: string
            - type: string
              maxLength: 2048
            items: false
            minItems: 2
            maxItems: 2
      required: []
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
      priority: header
    request:
      connection: tapis
      operation: jobs.search
      params: '{{params}}'
