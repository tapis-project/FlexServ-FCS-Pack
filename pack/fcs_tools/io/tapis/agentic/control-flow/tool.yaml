schema_version: flexserv.tool.v1alpha1
kind: Tool
metadata:
  name: io.tapis.agentic.control-flow
  version: 0.1.0
spec:
  contract:
    description: Demonstrate CEL when predicates, ordered branches, and bounded foreach loops.
    read_only: true
    concurrency_safe: true
    parameters_schema:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: ["semantic", "keyword", "hybrid"]
          default: "hybrid"
        query:
          type: string
          default: ""
        hits:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              title:
                type: string
              score:
                type: number
            required: ["title", "score"]
          default: []
      required: ["mode", "query", "hits"]
  policy:
    provider: flexserv
    confirmation: never
    resources:
      timeout_ms: 10000
      max_output_bytes: 1048576
      max_concurrent_runs: 8
      rate_limit_per_minute: 120
  steps:
    - id: maybe_echo_query
      kind: native
      when: input.query != ""
      tool: flexserv.builtin.echo
      input:
        message: "{{input.query}}"
      timeout_ms: 1000

    - id: choose_mode
      kind: branch
      cases:
        - id: semantic
          when: input.mode == "semantic"
          steps:
            - id: selected
              kind: native
              tool: flexserv.builtin.echo
              input:
                message: semantic
        - id: keyword
          when: input.mode == "keyword"
          steps:
            - id: selected
              kind: native
              tool: flexserv.builtin.echo
              input:
                message: keyword
      default:
        steps:
          - id: selected
            kind: native
            tool: flexserv.builtin.echo
            input:
              message: hybrid

    - id: echo_high_score_hits
      kind: foreach
      over: input.hits
      item: hit
      max_iterations: 10
      steps:
        - id: echo_hit
          kind: native
          when: hit.score >= 0.5
          tool: flexserv.builtin.echo
          input:
            message: "{{index}}:{{hit.title}}"
