schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.context.get
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-core
spec:
  contract:
    description: Return the authenticated tenant user profile; no token values are
      returned by this adapter.
    parameters_schema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
      priority: header
    request:
      connection: tapis
      operation: context.get
      params: '{{params}}'
