schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.apps.get
  version: 0.12.0
  visibility: true
  labels:
    pack: tapis-core
spec:
  contract:
    description: Tapis apps.get
    parameters_schema:
      type: object
      properties:
        app_id: &id001
          type: string
          minLength: 1
          maxLength: 256
        app_version: *id001
      required:
      - app_id
      - app_version
      additionalProperties: false
    output_schema:
      type: object
  secret_refs:
    tapis_token: tapis.access_token
  steps:
  - id: call
    kind: rest
    caller: tapis
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
    request:
      connection: tapis
      operation: apps.get
      params: '{{params}}'
