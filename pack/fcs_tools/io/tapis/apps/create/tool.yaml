schema_version: flexserv.tool.v1alpha2
kind: Tool
metadata:
  name: io.tapis.apps.create
  version: 1.0.0
  visibility: false
spec:
  contract:
    description: io.tapis.apps.create (bounded, owner-authorized workflow component)
    parameters_schema:
      type: object
      properties:
        definition: &id001
          type: object
      required:
      - definition
      additionalProperties: false
    output_schema: *id001
  policy:
    resources:
    - local_login
    - ssh_keys
    - ssh_workspace
    - service_tokens
    programs:
    - bash
    filesystem:
      read:
      - /
      write:
      - '{{host.SCRATCH}}/'
  steps:
  - id: request
    kind: rest
    request:
      connection: tapis
      method: POST
      path:
      - v3
      - apps
      response: json
      body:
        type: json
        value: '{{params.definition}}'
    auth:
      header_passthrough:
      - X-TAPIS-TOKEN
      inject:
        headers:
          X-TAPIS-TOKEN: '{{secret.tapis_token}}'
      required_headers:
      - X-TAPIS-TOKEN
  - id: confirmed
    kind: call
    tool:
      name: io.tapis.responses.require_success
      version: 1.0.0
    input:
      response: '{{steps.request}}'
  - id: identity
    kind: bashkit
    script: scripts/identity.sh
    input:
      definition: '{{params.definition}}'
      response: '{{steps.request}}'
    uses: {}
  secret_refs:
    tapis_token: tapis.access_token
