schema_version: flexserv.tool.v1alpha3
kind: Tool
metadata:
  name: edu.utexas.tacc.flexserv.deployment.vllm.prepare
  version: 1.0.0
  visibility: true
spec:
  contract:
    description: Prepare via the existing managed model downloader and retain a verified
      portable receipt.
    parameters_schema: schemas/input.json
    output_schema: schemas/output.json
  policy:
    derive: dependencies
    resources:
    - local_vllm
  steps:
  - id: operation
    kind: call
    tool:
      name: edu.utexas.tacc.flexserv.deployment.prepare
      version: 1.0.0
    input:
      profile: local_vllm
      input: '{{params}}'
  result: '{{steps.operation}}'
  execution:
    mode: background
    timeout_seconds: 7200
    max_calls: 512
