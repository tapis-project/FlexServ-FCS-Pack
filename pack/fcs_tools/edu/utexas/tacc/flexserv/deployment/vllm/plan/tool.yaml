schema_version: flexserv.tool.v1alpha3
kind: Tool
metadata:
  name: edu.utexas.tacc.flexserv.deployment.vllm.plan
  version: 1.0.0
  visibility: true
spec:
  contract:
    description: Reserve actual devices/ports and seal the immutable commands shown
      in review.
    parameters_schema: schemas/input.json
    output_schema: schemas/output.json
  policy:
    derive: dependencies
    resources:
    - local_vllm
  steps:
  - id: operation
    kind: call
    tool:
      name: edu.utexas.tacc.flexserv.deployment.planning.reserve
      version: 1.0.0
    input:
      profile: local_vllm
      input: '{{params}}'
  result: '{{steps.operation}}'
