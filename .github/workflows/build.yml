name: Build v0.13 Capability Pack
on:
  push:
    branches: [flexserv/new_fcs]
    tags: ['pack-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_packaging.py'
      - run: bash scripts/package_fcs_pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flexserv-capability-pack
          path: dist/flexserv-capability-pack.zip*
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/pack-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/flexserv-capability-pack.zip* --generate-notes
    permissions:
      contents: write
