name: Pinned signed release compatibility
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux-amd64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: macos-15-intel, platform: macos-amd64}
          - {runner: macos-15, platform: macos-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install independently pinned verifier
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/fetch_ci_tools.py --platform "$PLATFORM"
      - name: Verify released compatibility including minimum FCS
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_COMPATIBILITY_POLICY: ${{ vars.RELEASE_COMPATIBILITY_POLICY }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(".ci-tools/policy.json").write_text(os.environ["RELEASE_COMPATIBILITY_POLICY"])'
          python3 scripts/check_released_compatibility.py --platform "$PLATFORM" --policy .ci-tools/policy.json
