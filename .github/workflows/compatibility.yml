name: FCS pack loading compatibility
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      fcs_branch:
        description: FCS branch to download
        type: string
        default: main
      pack_branch:
        description: Pack branch to test
        type: string
        default: main
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      fcs_sha: ${{ steps.resolve.outputs.source_sha }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      pack_sha: ${{ steps.pack.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned verifier
        run: python3 scripts/fetch_ci_tools.py --platform linux-amd64
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.pack_branch || 'main' }}
          path: selected-pack
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.FCS_ARTIFACT_READ_TOKEN || github.token }}
          FCS_REPOSITORY: ${{ vars.FCS_REPOSITORY || format('{0}/FlexServ-FCS', github.repository_owner) }}
          FCS_BRANCH: ${{ inputs.fcs_branch || 'main' }}
        run: python3 scripts/compatibility.py resolve --repository "$FCS_REPOSITORY" --branch "$FCS_BRANCH"
      - id: pack
        name: Package the selected pack commit
        run: |
          printf 'sha=%s\n' "$(git -C selected-pack rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/package_pack.py selected-pack/pack dist/compatibility-pack.tar.gz --descriptor selected-pack/release-descriptor.json
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/compatibility-pack.tar.gz
          if-no-files-found: error
          retention-days: 7
  load:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64}
          - {runner: macos-15-intel, platform: macos, arch: amd64}
          - {runner: macos-15, platform: macos, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned verifier for this platform
        env:
          PLATFORM: ${{ matrix.platform }}-${{ matrix.arch }}
        run: python3 scripts/fetch_ci_tools.py --platform "$PLATFORM"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compatibility-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Download the exact successful FCS build
        env:
          GH_TOKEN: ${{ secrets.FCS_ARTIFACT_READ_TOKEN || github.token }}
          FCS_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          FCS_RUN: ${{ needs.prepare.outputs.run_id }}
          FCS_SHA: ${{ needs.prepare.outputs.fcs_sha }}
          FCS_BRANCH: ${{ inputs.fcs_branch || 'main' }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/compatibility.py download --repository "$FCS_REPOSITORY" --run-id "$FCS_RUN" --sha "$FCS_SHA" --branch "$FCS_BRANCH" --platform "$PLATFORM" --arch "$ARCH" --directory dist/fcs
      - name: Install by URL and verify REST, MCP, and restart
        env:
          FLEXSERV_FCS_GITHUB_TOKEN: ${{ github.token }}
          PACK_URL: ${{ needs.prepare.outputs.artifact_url }}
        run: python3 scripts/compatibility.py smoke --binary dist/fcs/flexserv-fcs --archive dist/compatibility-pack.tar.gz --artifact-url "$PACK_URL" --log dist/fcs.log
      - name: Record tested revisions
        if: always()
        env:
          FCS_SHA: ${{ needs.prepare.outputs.fcs_sha }}
          PACK_SHA: ${{ needs.prepare.outputs.pack_sha }}
          FCS_RUN: ${{ needs.prepare.outputs.run_id }}
        run: printf 'FCS commit `%s` (run %s)\n\nPack commit `%s`\n' "$FCS_SHA" "$FCS_RUN" "$PACK_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compatibility-logs-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: dist/*.log
          if-no-files-found: warn
