schema_version: flexserv.tool.v1alpha1
kind: Tool
metadata:
  name: io.tapis.agentic.model
  version: 0.1.0
spec:
  contract:
    description: Execute OpenSearch retrieval for model metadata using YAML REST steps, vault-backed credentials, and branch-selected query templates.
    read_only: true
    concurrency_safe: true
    required_scopes: ["model-rag:search"]
    parameters_schema:
      type: object
      additionalProperties: false
      properties:
        search_mode:
          type: string
          enum: ["hybrid", "semantic", "science", "keyword"]
          default: "hybrid"
        query_text:
          type: string
          minLength: 1
        query_vector:
          type: array
          items: { type: number }
          minItems: 1
        science_query_vector:
          type: ["array", "null"]
          items: { type: number }
          default: null
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      required: ["query_text", "query_vector"]
  policy:
    provider: flexserv
    confirmation: never
    required_scopes: ["model-rag:search"]
    network:
      allow_localhost: true
      allowed_schemes: ["http", "https"]
      require_tls_for_remote: true
      allowed_hosts:
        - "pods.tacc.tapis.io"
    resources:
      timeout_ms: 30000
      max_output_bytes: 1048576
      max_concurrent_runs: 8
      rate_limit_per_minute: 120
  steps:
    - id: query_template
      kind: branch
      cases:
        - id: science
          when: input.search_mode == "science" && input.science_query_vector != null
          steps:
            - id: science_search
              kind: rest
              method: POST
              url: "{{secrets.url}}/{{secrets.index}}/_search"
              secret_refs:
                url: model_rag.opensearch.url
                index: model_rag.opensearch.index
                username: model_rag.opensearch.username
                password: model_rag.opensearch.password
              auth:
                basic:
                  username: "{{secrets.username}}"
                  password: "{{secrets.password}}"
              headers:
                content-type: application/json
              body:
                size: "{{input.top_k}}"
                _source:
                  - model_id
                  - pipeline_tag
                  - library_name
                  - license
                  - downloads
                  - likes
                  - tags
                  - has_safetensors
                  - has_gguf
                query:
                  bool:
                    should:
                      - knn:
                          vec_core_science:
                            vector: "{{input.science_query_vector}}"
                            k: 50
                      - knn:
                          vec_core_general:
                            vector: "{{input.query_vector}}"
                            k: 50
                      - multi_match:
                          query: "{{input.query_text}}"
                          fields: ["core_text^2", "tags_text^1.5", "model_id"]
                          type: best_fields
                    minimum_should_match: 1
              timeout_ms: 30000

        - id: semantic
          when: input.search_mode == "semantic"
          steps:
            - id: semantic_search
              kind: rest
              method: POST
              url: "{{secrets.url}}/{{secrets.index}}/_search"
              secret_refs:
                url: model_rag.opensearch.url
                index: model_rag.opensearch.index
                username: model_rag.opensearch.username
                password: model_rag.opensearch.password
              auth:
                basic:
                  username: "{{secrets.username}}"
                  password: "{{secrets.password}}"
              headers:
                content-type: application/json
              body:
                size: "{{input.top_k}}"
                _source:
                  - model_id
                  - pipeline_tag
                  - library_name
                  - license
                  - downloads
                  - likes
                  - tags
                  - has_safetensors
                  - has_gguf
                query:
                  bool:
                    should:
                      - knn:
                          vec_core_general:
                            vector: "{{input.query_vector}}"
                            k: 50
                      - knn:
                          vec_tags_general:
                            vector: "{{input.query_vector}}"
                            k: 50
                    minimum_should_match: 1
              timeout_ms: 30000

        - id: keyword
          when: input.search_mode == "keyword"
          steps:
            - id: keyword_search
              kind: rest
              method: POST
              url: "{{secrets.url}}/{{secrets.index}}/_search"
              secret_refs:
                url: model_rag.opensearch.url
                index: model_rag.opensearch.index
                username: model_rag.opensearch.username
                password: model_rag.opensearch.password
              auth:
                basic:
                  username: "{{secrets.username}}"
                  password: "{{secrets.password}}"
              headers:
                content-type: application/json
              body:
                size: "{{input.top_k}}"
                _source:
                  - model_id
                  - pipeline_tag
                  - library_name
                  - license
                  - downloads
                  - likes
                  - tags
                  - has_safetensors
                  - has_gguf
                query:
                  multi_match:
                    query: "{{input.query_text}}"
                    fields: ["core_text^2", "tags_text^1.5", "model_id"]
                    type: best_fields
              timeout_ms: 30000

      default:
        steps:
          - id: hybrid_search
            kind: rest
            method: POST
            url: "{{secrets.url}}/{{secrets.index}}/_search"
            secret_refs:
              url: model_rag.opensearch.url
              index: model_rag.opensearch.index
              username: model_rag.opensearch.username
              password: model_rag.opensearch.password
            auth:
              basic:
                username: "{{secrets.username}}"
                password: "{{secrets.password}}"
            headers:
              content-type: application/json
            body:
              size: "{{input.top_k}}"
              _source:
                - model_id
                - pipeline_tag
                - library_name
                - license
                - downloads
                - likes
                - tags
                - has_safetensors
                - has_gguf
              query:
                bool:
                  should:
                    - knn:
                        vec_core_general:
                          vector: "{{input.query_vector}}"
                          k: 50
                    - knn:
                        vec_tags_general:
                          vector: "{{input.query_vector}}"
                          k: 50
                    - multi_match:
                        query: "{{input.query_text}}"
                        fields: ["core_text^2", "tags_text^1.5", "model_id"]
                        type: best_fields
                  minimum_should_match: 1
            timeout_ms: 30000
