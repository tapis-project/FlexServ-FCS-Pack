schema_version: flexserv.tool.v1alpha1
kind: Tool
metadata:
  name: io.tapis.access.check
  version: 0.1.0
  labels: { execution_types: "REST", tapis_domain: security, pack: tapis-core }
spec:
  contract:
    description: Check whether a Tapis user has a permission in a tenant.
    read_only: true
    concurrency_safe: true
    required_scopes: ["tapis:access:check"]
    parameters_schema:
      type: object
      additionalProperties: false
      properties:
        tenant: { type: string }
        user: { type: string }
        perm_spec: { type: string }
        or_admin: { type: boolean }
      required: [tenant, user, perm_spec, or_admin]
  policy:
    provider: flexserv
    confirmation: never
    required_scopes: ["tapis:access:check"]
    network: { allowed_hosts: ["tapis.io"], allowed_schemes: ["https"], require_tls_for_remote: true }
    resources: { timeout_ms: 10000, rate_limit_per_minute: 60 }
  steps:
    - id: check_permission
      kind: rest
      method: POST
      url: "{{secrets.base_url}}/v3/security/user/isPermitted"
      secret_refs: { base_url: tapis.base_url, access_token: tapis.access_token }
      headers: { Content-Type: application/json, X-Tapis-Token: "{{secrets.access_token}}" }
      body:
        tenant: "{{input.tenant}}"
        user: "{{input.user}}"
        permSpec: "{{input.perm_spec}}"
        orAdmin: "{{input.or_admin}}"
      response: { type: json }
      timeout_ms: 10000
