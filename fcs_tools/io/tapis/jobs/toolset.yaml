schema_version: flexserv.toolset.v1alpha1
kind: ToolSet
metadata:
  name: io.tapis.jobs
  version: 0.1.0
  labels:
    organization: tapis
    domain: jobs
spec:
  description: Tapis Jobs REST capabilities.
  skill_scopes: ["tapis:jobs:read", "tapis:jobs:submit", "tapis:jobs:cancel"]
  tools:
    - name: io.tapis.jobs.submit
      version: 0.1.0
      path: submit
    - name: io.tapis.jobs.get
      version: 0.1.0
      path: get
    - name: io.tapis.jobs.cancel
      version: 0.1.0
      path: cancel
    - name: io.tapis.jobs.logs
      version: 0.1.0
      path: logs
    - name: io.tapis.jobs.prepare
      version: 0.1.0
      path: prepare
    - name: io.tapis.jobs.search
      version: 0.1.0
      path: search
    - name: io.tapis.jobs.inspect
      version: 0.1.0
      path: inspect
    - name: io.tapis.jobs.wait
      version: 0.1.0
      path: wait
    - name: io.tapis.jobs.outputs.list
      version: 0.1.0
      path: outputs/list
    - name: io.tapis.jobs.outputs.read
      version: 0.1.0
      path: outputs/read
    - name: io.tapis.jobs.outputs.download
      version: 0.1.0
      path: outputs/download
