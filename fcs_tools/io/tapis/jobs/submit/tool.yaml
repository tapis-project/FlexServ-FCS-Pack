schema_version: flexserv.tool.v1alpha1
kind: Tool
metadata:
  name: io.tapis.jobs.submit
  version: 0.1.0
  labels: { execution_types: "REST", tapis_domain: jobs, pack: tapis-jobs }
spec:
  contract:
    description: Submit a complete Tapis job request.
    read_only: false
    concurrency_safe: true
    required_scopes: ["tapis:jobs:submit"]
    parameters_schema:
      type: object
      additionalProperties: false
      properties:
        job: { type: object, description: Request body defined by the Tapis Jobs API. }
      required: [job]
  policy:
    provider: flexserv
    confirmation: always
    required_scopes: ["tapis:jobs:submit"]
    network: { allowed_hosts: ["tapis.io"], allowed_schemes: ["https"], require_tls_for_remote: true }
    resources: { timeout_ms: 30000, rate_limit_per_minute: 30 }
  steps:
    - id: submit_job
      kind: rest
      method: POST
      url: "{{secrets.base_url}}/v3/jobs/submit"
      secret_refs: { base_url: tapis.base_url, access_token: tapis.access_token }
      headers: { Content-Type: application/json, X-Tapis-Token: "{{secrets.access_token}}" }
      body: "{{input.job}}"
      response: { type: json }
      timeout_ms: 30000
