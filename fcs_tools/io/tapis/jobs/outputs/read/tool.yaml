schema_version: flexserv.tool.v1alpha1
kind: Tool
metadata: { name: io.tapis.jobs.outputs.read, version: 0.1.0, labels: { execution_types: "REST", tapis_domain: jobs, pack: tapis-jobs } }
spec:
  contract:
    description: Read one Tapis job output file without archive compression.
    read_only: true
    concurrency_safe: true
    required_scopes: ["tapis:jobs:outputs:read"]
    parameters_schema:
      type: object
      additionalProperties: false
      properties: { job_uuid: { type: string }, output_path: { type: string } }
      required: [job_uuid, output_path]
  policy:
    provider: flexserv
    confirmation: never
    required_scopes: ["tapis:jobs:outputs:read"]
    network: { allowed_hosts: ["tapis.io"], allowed_schemes: ["https"], require_tls_for_remote: true }
    resources: { timeout_ms: 30000, max_output_bytes: 1048576, rate_limit_per_minute: 60 }
  steps:
    - id: read_output
      kind: rest
      method: GET
      url: "{{secrets.base_url}}/v3/jobs/{{input.job_uuid}}/output/download/{{input.output_path}}?compress=false"
      secret_refs: { base_url: tapis.base_url, access_token: tapis.access_token }
      headers: { X-Tapis-Token: "{{secrets.access_token}}" }
      response: { type: text }
      timeout_ms: 30000
