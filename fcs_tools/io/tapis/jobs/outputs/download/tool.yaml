schema_version: flexserv.tool.v1alpha1
kind: Tool
metadata: { name: io.tapis.jobs.outputs.download, version: 0.1.0, labels: { execution_types: "REST", tapis_domain: jobs, pack: tapis-jobs } }
spec:
  contract:
    description: Download a Tapis job output path as a zip archive.
    read_only: true
    concurrency_safe: true
    required_scopes: ["tapis:jobs:outputs:read"]
    parameters_schema:
      type: object
      additionalProperties: false
      properties: { job_uuid: { type: string }, output_path: { type: string } }
      required: [job_uuid, output_path]
  policy:
    provider: flexserv
    confirmation: never
    required_scopes: ["tapis:jobs:outputs:read"]
    network: { allowed_hosts: ["tapis.io"], allowed_schemes: ["https"], require_tls_for_remote: true }
    resources: { timeout_ms: 60000, max_output_bytes: 10485760, rate_limit_per_minute: 30 }
  steps:
    - id: download_outputs
      kind: rest
      method: GET
      url: "{{secrets.base_url}}/v3/jobs/{{input.job_uuid}}/output/download/{{input.output_path}}?compress=true&format=zip"
      secret_refs: { base_url: tapis.base_url, access_token: tapis.access_token }
      headers: { X-Tapis-Token: "{{secrets.access_token}}" }
      response: { type: binary }
      timeout_ms: 60000
