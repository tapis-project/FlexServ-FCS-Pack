schema_version: flexserv.tool.v1alpha1
kind: Tool
metadata: { name: io.tapis.jobs.wait, version: 0.1.0, labels: { execution_types: "REST", tapis_domain: jobs, pack: tapis-jobs } }
spec:
  contract:
    description: Retrieve the current job status for bounded caller-side wait orchestration.
    read_only: true
    concurrency_safe: true
    required_scopes: ["tapis:jobs:read"]
    parameters_schema: { type: object, additionalProperties: false, properties: { job_uuid: { type: string } }, required: [job_uuid] }
  policy:
    provider: flexserv
    confirmation: never
    required_scopes: ["tapis:jobs:read"]
    network: { allowed_hosts: ["tapis.io"], allowed_schemes: ["https"], require_tls_for_remote: true }
    resources: { timeout_ms: 15000, rate_limit_per_minute: 120 }
  steps:
    - id: get_job_status
      kind: rest
      method: GET
      url: "{{secrets.base_url}}/v3/jobs/{{input.job_uuid}}/status"
      secret_refs: { base_url: tapis.base_url, access_token: tapis.access_token }
      headers: { X-Tapis-Token: "{{secrets.access_token}}" }
      response: { type: json }
      timeout_ms: 15000
